substitutions:
  device_name: weather-station-skalka
  friendly_name: Weather Station Skalka
  ota_manifest_url: "https://raw.githubusercontent.com/SamuelHudec/pg-meteo/main/skalka/firmware/manifest.json"
  wifi_connect_timeout: 15s
  sntp_sync_timeout: 15s
  ota_check_result_timeout: 8s
  pre_sleep_network_settle_delay: 500ms
  sensor_boot_stabilization_delay: 3s
  measurement_duration: 60s
  deep_sleep_failsafe_run_duration: 100s
  deep_sleep_duration: 520s
  fw_version: 0.1.0
  fake_windguru_url: "http://192.168.18.3:8080/upload/api.php"
  fake_windguru_uid: "97411"
  real_windguru_url: "https://www.windguru.cz/upload/api.php"
  real_windguru_uid: !secret windguru_station_uid
  real_windguru_password: !secret windguru_station_password
  anemometer_factor: "0.005560619"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - windguru_auth.h
  project:
    name: samuelhudec.pg_meteo
    version: ${fw_version}
  on_boot:
    priority: 800
    then:
      - wifi.disable:
      - switch.turn_on: i2c_power
      - script.execute: production_cycle
  on_shutdown:
    then:
      - if:
          condition:
            lambda: |-
              return id(ota_install_in_progress);
          then:
            - logger.log: "OTA: install handed off, rebooting"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

i2c:
  sda: 19
  scl: 18
  scan: true
  id: bus_a

switch:
  - platform: gpio
    pin: GPIO4
    id: i2c_power
    restore_mode: ALWAYS_OFF

button:
  - platform: restart
    name: "${friendly_name} Restart"

logger:
  level: INFO

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: "Vyhliadka_FREE"
  enable_on_boot: false
  reboot_timeout: 0s

time:
  - platform: sntp
    id: sntp_time

http_request:
  buffer_size_rx: 2048
  timeout: 10s
  follow_redirects: true

ota:
  - platform: esphome
  - platform: http_request
    id: ota_http

update:
  - platform: http_request
    id: fw_update
    name: "${friendly_name} Firmware Update"
    source: ${ota_manifest_url}
    update_interval: never
    on_update_available:
      then:
        - lambda: |-
            id(ota_install_in_progress) = true;
        - logger.log: "OTA: update available, starting update"
        - delay: 3s
        - update.perform: fw_update

deep_sleep:
  id: sleep_ctrl
  run_duration: ${deep_sleep_failsafe_run_duration}
  sleep_duration: ${deep_sleep_duration}

globals:
  - id: wind_speed_sum
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: wind_speed_samples
    type: int
    restore_value: no
    initial_value: "0"
  - id: wind_speed_max_sample
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: wind_dir_sin_sum
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: wind_dir_cos_sum
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: wind_dir_samples
    type: int
    restore_value: no
    initial_value: "0"
  - id: measurement_active
    type: bool
    restore_value: no
    initial_value: "false"
  - id: ota_install_in_progress
    type: bool
    restore_value: no
    initial_value: "false"

script:
  - id: reset_measurement_stats
    mode: restart
    then:
      - lambda: |-
          id(wind_speed_sum) = 0.0f;
          id(wind_speed_samples) = 0;
          id(wind_speed_max_sample) = 0.0f;
          id(wind_dir_sin_sum) = 0.0f;
          id(wind_dir_cos_sum) = 0.0f;
          id(wind_dir_samples) = 0;
          id(measurement_active) = false;

  - id: finalize_measurement_stats
    mode: restart
    then:
      - lambda: |-
          const float avg = id(wind_speed_samples) > 0
            ? id(wind_speed_sum) / id(wind_speed_samples)
            : id(wind_speed_ms).state;
          const float max_v = id(wind_speed_samples) > 0
            ? id(wind_speed_max_sample)
            : id(wind_speed_ms).state;
          float avg_dir = id(wind_heading).state;
          if (id(wind_dir_samples) > 0) {
            const float mean_sin = id(wind_dir_sin_sum) / id(wind_dir_samples);
            const float mean_cos = id(wind_dir_cos_sum) / id(wind_dir_samples);
            const float magnitude = sqrtf(mean_sin * mean_sin + mean_cos * mean_cos);
            if (magnitude > 0.01f) {
              avg_dir = atan2f(mean_sin, mean_cos) * 180.0f / 3.14159265f;
              if (avg_dir < 0.0f) {
                avg_dir += 360.0f;
              }
            }
          }

          id(wind_speed_avg_window).publish_state(avg);
          id(wind_speed_max_window).publish_state(max_v);
          id(wind_heading_avg_window).publish_state(avg_dir);

          ESP_LOGI(
            "wind_stats",
            "Wind ${measurement_duration} stats: speed_samples=%d avg=%.2f m/s max=%.2f m/s dir_samples=%d avg_dir=%.1f deg",
            id(wind_speed_samples),
            avg,
            max_v,
            id(wind_dir_samples),
            avg_dir
          );

  - id: finish_after_upload
    mode: restart
    then:
      - script.execute: reset_measurement_stats
      - logger.log: "Cycle: upload finished, checking OTA"
      - update.check: fw_update
      - delay: ${ota_check_result_timeout}
      - if:
          condition:
            lambda: |-
              return id(ota_install_in_progress);
          then:
            - logger.log: "OTA: install in progress"
          else:
            - logger.log: "OTA: no update available"
            - script.execute: enter_production_sleep

  - id: enter_production_sleep
    mode: restart
    then:
      - logger.log: "Cycle: entering deep sleep"
      - delay: ${pre_sleep_network_settle_delay}
      - wifi.disable:
      - delay: ${pre_sleep_network_settle_delay}
      - switch.turn_off: i2c_power
      - deep_sleep.enter: sleep_ctrl

  - id: send_real_windguru
    mode: queued
    then:
      - http_request.get:
          url: !lambda |-
            char buf[640];
            const float temp = isnan(id(temperature).state) ? 22.5f : id(temperature).state;
            const float hum = isnan(id(humidity).state) ? 55.0f : id(humidity).state;
            const int wind_dir = isnan(id(wind_heading_avg_window).state) ? 180 : (int) roundf(id(wind_heading_avg_window).state);
            const float wind_avg_knots = id(wind_speed_avg_window).state * 1.94384f;
            const float wind_max_knots = id(wind_speed_max_window).state * 1.94384f;
            const auto now = id(sntp_time).now();
            const long timestamp = now.is_valid() ? now.timestamp : 0;
            const std::string salt = std::to_string(timestamp);
            const std::string hash = windguru_md5_hex(
              salt + std::string("${real_windguru_uid}") + std::string("${real_windguru_password}")
            );
            snprintf(
              buf,
              sizeof(buf),
              "${real_windguru_url}?uid=${real_windguru_uid}&salt=%s&hash=%s&interval=60&unixtime=%ld&wind_avg=%.2f&wind_max=%.2f&wind_direction=%d&wind_dir=%d&temperature=%.2f&rh=%.2f&mslp=1013.2",
              salt.c_str(),
              hash.c_str(),
              timestamp,
              wind_avg_knots,
              wind_max_knots,
              wind_dir,
              wind_dir,
              temp,
              hum
            );
            return std::string(buf);
          on_response:
            then:
              - lambda: |-
                  auto body = body.value_or("");
                  ESP_LOGI(
                    "windguru",
                    "Real Windguru send complete: HTTP %d in %u ms, body: %s",
                    response->status_code,
                    response->duration_ms,
                    body.c_str()
                  );
              - script.execute: finish_after_upload
          on_error:
            then:
              - lambda: |-
                  ESP_LOGI("windguru", "Real Windguru send failed");
              - script.execute: finish_after_upload
          capture_response: true
          max_response_buffer_size: 512

  - id: send_windguru
    mode: queued
    then:
      - script.execute: finalize_measurement_stats
      - http_request.get:
          url: !lambda |-
            char buf[384];
            const float temp = isnan(id(temperature).state) ? 22.5f : id(temperature).state;
            const float hum = isnan(id(humidity).state) ? 55.0f : id(humidity).state;
            const int wind_dir = isnan(id(wind_heading_avg_window).state) ? 180 : (int) roundf(id(wind_heading_avg_window).state);
            const float wind_avg_knots = id(wind_speed_avg_window).state * 1.94384f;
            const float wind_max_knots = id(wind_speed_max_window).state * 1.94384f;
            const auto now = id(sntp_time).now();
            const long timestamp = now.is_valid() ? now.timestamp : 0;
            snprintf(
              buf,
              sizeof(buf),
              "${fake_windguru_url}?uid=${fake_windguru_uid}&interval=60&unixtime=%ld&wind_avg=%.2f&wind_max=%.2f&wind_direction=%d&temperature=%.2f&rh=%.2f&mslp=1013.2",
              timestamp,
              wind_avg_knots,
              wind_max_knots,
              wind_dir,
              temp,
              hum
            );
            return std::string(buf);
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("windguru", "Fake Windguru send complete: HTTP %d in %u ms", response->status_code, response->duration_ms);
              - script.execute: send_real_windguru
          on_error:
            then:
              - lambda: |-
                  ESP_LOGI("windguru", "Fake Windguru send failed");
              - script.execute: send_real_windguru

  - id: production_cycle
    mode: restart
    then:
      - lambda: |-
          id(ota_install_in_progress) = false;
      - script.execute: reset_measurement_stats
      - lambda: |-
          id(measurement_active) = true;
      - logger.log: "Cycle: measurement phase started"
      - delay: ${sensor_boot_stabilization_delay}
      - delay: ${measurement_duration}
      - lambda: |-
          id(measurement_active) = false;
      - logger.log: "Cycle: measurement done, connecting WiFi"
      - wifi.enable:
      - wait_until:
          condition:
            wifi.connected:
          timeout: ${wifi_connect_timeout}
      - if:
          condition:
            wifi.connected:
          then:
            - logger.log: "Cycle: WiFi connected, waiting for time sync"
            - wait_until:
                condition:
                  time.has_time:
                timeout: ${sntp_sync_timeout}
            - if:
                condition:
                  time.has_time:
                then:
                  - logger.log: "Cycle: time sync ready, sending data"
                  - script.execute: send_windguru
                else:
                  - logger.log: "Cycle: time sync timeout, upload skipped"
                  - script.execute: finish_after_upload
          else:
            - logger.log: "Cycle: WiFi timeout, upload skipped"
            - script.execute: reset_measurement_stats
            - script.execute: enter_production_sleep

sensor:
  - platform: pulse_meter
    pin:
      number: GPIO10
      mode: INPUT_PULLUP
    id: wind_speed_ms
    name: "${friendly_name} Wind Speed"
    unit_of_measurement: "m/s"
    icon: "mdi:weather-windy"
    internal_filter: 13us
    timeout: 5s
    accuracy_decimals: 2
    filters:
      - multiply: ${anemometer_factor}
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
    on_value:
      - lambda: |-
          if (id(measurement_active) && !isnan(x)) {
            id(wind_speed_sum) += x;
            id(wind_speed_samples) += 1;
            if (id(wind_speed_samples) == 1 || x > id(wind_speed_max_sample)) {
              id(wind_speed_max_sample) = x;
            }
          }

  - platform: template
    id: wind_speed_avg_window
    name: "${friendly_name} Wind Speed Avg"
    unit_of_measurement: "m/s"
    icon: "mdi:weather-windy"
    accuracy_decimals: 2

  - platform: template
    id: wind_speed_max_window
    name: "${friendly_name} Wind Speed Max"
    unit_of_measurement: "m/s"
    icon: "mdi:weather-windy"
    accuracy_decimals: 2

  - platform: adc
    id: wind_vane_adc
    pin: GPIO1
    attenuation: 12db
    update_interval: 500ms
    internal: true
    filters:
      - median:
          window_size: 3
          send_every: 1
          send_first_at: 1

  - platform: resistance
    id: wind_vane_resistance
    sensor: wind_vane_adc
    configuration: DOWNSTREAM
    resistor: 10kOhm
    reference_voltage: 3.3V
    internal: true
    on_value:
      - lambda: |-
          struct Point { float ohm; float deg; };
          static const Point table[] = {
            {3000.0f,   0.0f},
            {15220.0f,  22.5f},
            { 12200.0f,  45.0f},
            { 68760.0f,  90.0f},
            { 46500.0f, 135.0f},
            {25500.0f, 180.0f},
            { 31700.0f, 202.5f},
            {6200.0f, 225.0f},
            {830.0f,270.0f},
            {1520.0f, 315.0f},
          };

          float best_deg = table[0].deg;
          float best_err = fabsf(x - table[0].ohm);
          for (size_t i = 1; i < (sizeof(table) / sizeof(table[0])); i++) {
            const float err = fabsf(x - table[i].ohm);
            if (err < best_err) {
              best_err = err;
              best_deg = table[i].deg;
            }
          }

          id(wind_heading).publish_state(best_deg);

  - platform: template
    id: wind_heading
    name: "${friendly_name} Wind Direction"
    unit_of_measurement: "°"
    icon: "mdi:compass"
    accuracy_decimals: 1
    on_value:
      - lambda: |-
          if (id(measurement_active) && !isnan(x)) {
            const float rad = x * 3.14159265f / 180.0f;
            id(wind_dir_sin_sum) += sinf(rad);
            id(wind_dir_cos_sum) += cosf(rad);
            id(wind_dir_samples) += 1;
          }

  - platform: template
    id: wind_heading_avg_window
    name: "${friendly_name} Wind Direction Avg"
    unit_of_measurement: "°"
    icon: "mdi:compass"
    accuracy_decimals: 1

  - platform: sht4x
    update_interval: 15s
    temperature:
      name: "Temperature"
      id: temperature
    humidity:
      name: "Humidity"
      id: humidity

binary_sensor:
  - platform: template
    name: "${friendly_name} Time Valid"
    lambda: |-
      return id(sntp_time).now().is_valid();
