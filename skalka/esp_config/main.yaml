substitutions:
  device_name: weather-station-skalka
  friendly_name: Weather Station Skalka
  ota_manifest_url: "https://raw.githubusercontent.com/SamuelHudec/pg-meteo/main/skalka/firmware/manifest.json"
  wifi_wait_timeout: 30s
  boot_stabilize_delay: 3s
  run_duration_seconds: "120"
  run_duration: 120s
  sleep_duration: 10min
  fw_version: 0.0.0-dev
  wg_test_url: "http://192.168.1.162:8080/upload/api.php"
  wg_test_uid: "97411"
  wg_test_interval: 60s

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: samuelhudec.pg_meteo
    version: ${fw_version}
  on_boot:
    priority: -10
    then:
      - delay: ${boot_stabilize_delay}
      - component.update: firmware_version_text
      - logger.log: "Boot: waiting for WiFi before OTA check"
      - wait_until:
          condition:
            wifi.connected:
          timeout: ${wifi_wait_timeout}
      - if:
          condition:
            wifi.connected:
          then:
            - logger.log: "Boot: WiFi connected, OTA check started"
            - update.check: fw_update
          else:
            - logger.log: "Boot: WiFi timeout, OTA check skipped"
      - logger.log: "Deep sleep countdown started: active window ${run_duration}"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

i2c:
  sda: 19
  scl: 18
  scan: true
  id: bus_a

switch:
  - platform: gpio
    pin: GPIO4
    id: my_output
    restore_mode: ALWAYS_ON

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}_fallback"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80
  log: true

http_request:
  buffer_size_rx: 2048
  timeout: 10s
  follow_redirects: true

ota:
  - platform: esphome
  - platform: http_request
    id: ota_http

update:
  - platform: http_request
    id: fw_update
    name: "${friendly_name} Firmware Update"
    source: ${ota_manifest_url}
    update_interval: never
    on_update_available:
      then:
        - logger.log: "HTTP OTA: update available, starting update"
        - delay: 3s
        - update.perform: fw_update

script:
  - id: send_fake_windguru
    mode: queued
    then:
      - logger.log: "WG test send: pushing payload with live temperature/humidity"
      - http_request.get:
          url: !lambda |-
            char buf[320];
            const float temp = isnan(id(temperature).state) ? 22.5f : id(temperature).state;
            const float hum = isnan(id(humidity).state) ? 55.0f : id(humidity).state;
            snprintf(
              buf,
              sizeof(buf),
              "${wg_test_url}?uid=${wg_test_uid}&interval=60&wind_avg=4.2&wind_max=6.1&wind_min=2.8&wind_direction=180&temperature=%.2f&rh=%.2f&mslp=1013.2",
              temp,
              hum
            );
            return std::string(buf);

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi RSSI"
    update_interval: 15s

  - platform: uptime
    name: "${friendly_name} Uptime"
    update_interval: 15s

  - platform: adc
    pin: GPIO5
    name: "Analog GPIO5 Raw"
    id: analog_gpio5_raw
    attenuation: 11db
    update_interval: 1s

  - platform: sht4x
    temperature:
      name: "Temperature"
      id: temperature
    humidity:
      name: "Humidity"
      id: humidity

text_sensor:
  - platform: template
    name: "${friendly_name} Firmware Version"
    id: firmware_version_text
    icon: "mdi:identifier"
    update_interval: never
    lambda: |-
      return {"${fw_version}"};

  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP"
    ssid:
      name: "${friendly_name} SSID"

interval:
  - interval: 15s
    then:
      - lambda: |-
          const uint32_t active_s = ${run_duration_seconds};
          const uint32_t elapsed_s = millis() / 1000U;
          if (elapsed_s < active_s) {
            ESP_LOGI("sleep", "Deep sleep in %u s", active_s - elapsed_s);
          }
  - interval: ${wg_test_interval}
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - script.execute: send_fake_windguru
          else:
            - logger.log: "WG test send skipped: WiFi not connected"

