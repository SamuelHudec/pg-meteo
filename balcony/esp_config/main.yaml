substitutions:
  device_name: meteo_station
  friendly_name: Meteo station
  ota_manifest_url: "https://raw.githubusercontent.com/SamuelHudec/pg-meteo/main/balcony/firmware/manifest.json"
  wifi_wait_timeout: 15s
  time_sync_timeout: 15s
  ha_wait_timeout: 5s
  ha_publish_grace: 5s
  boot_stabilize_delay: 3s
  measurement_window: 60s
  run_duration: 100s
  sleep_duration: 1min
  fw_version: 0.0.0-dev
  wg_test_url: "http://192.168.1.2:8080/upload/api.php"
  wg_test_uid: "97411"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: samuelhudec.pg_meteo
    version: ${fw_version}
  on_boot:
    priority: 800
    then:
      - wifi.disable:
      - script.execute: production_cycle

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: UART0
  baud_rate: 115200

api:
  encryption:
    key: !secret MS_api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_on_boot: false
  reboot_timeout: 0s

time:
  - platform: sntp
    id: sntp_time

http_request:
  buffer_size_rx: 2048
  timeout: 10s
  follow_redirects: true

ota:
  - platform: esphome
    password: !secret MS_ota_password
  - platform: http_request
    id: ota_http

update:
  - platform: http_request
    id: fw_update
    name: "${friendly_name} Firmware Update"
    source: ${ota_manifest_url}
    update_interval: never

deep_sleep:
  id: sleep_ctrl
  run_duration: ${run_duration}
  sleep_duration: ${sleep_duration}

i2c:
  sda: 19
  scl: 18
  scan: true
  id: bus_a

switch:
  - platform: gpio
    pin: GPIO3
    id: my_output
    restore_mode: ALWAYS_ON

globals:
  - id: ota_last_check_key
    type: int
    restore_value: yes
    initial_value: "-1"
  - id: network_phase_done
    type: bool
    restore_value: no
    initial_value: "false"

script:
  - id: enter_production_sleep
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("cycle", "Cycle: entering deep sleep");
      - wifi.disable:
      - lambda: |-
          id(network_phase_done) = true;
      - deep_sleep.enter: sleep_ctrl

  - id: maybe_check_ota
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              const auto now = id(sntp_time).now();
              const int today_key = now.year * 1000 + now.day_of_year;
              return id(ota_last_check_key) != today_key;
          then:
            - lambda: |-
                const auto now = id(sntp_time).now();
                id(ota_last_check_key) = now.year * 1000 + now.day_of_year;
            - lambda: |-
                ESP_LOGI("ota", "OTA: daily check started");
            - update.check: fw_update
            - if:
                condition:
                  update.is_available: fw_update
                then:
                  - lambda: |-
                      ESP_LOGI("ota", "OTA: update available, starting update");
                  - delay: 3s
                  - update.perform: fw_update
                else:
                  - lambda: |-
                      ESP_LOGI("ota", "OTA: no update available");
                  - script.execute: enter_production_sleep
          else:
            - lambda: |-
                ESP_LOGI("ota", "OTA: daily check already done");
            - script.execute: enter_production_sleep

  - id: send_fake_windguru
    mode: queued
    then:
      - http_request.get:
          url: !lambda |-
            char buf[384];
            const float temp = isnan(id(meteo_station_Temperature).state) ? 22.5f : id(meteo_station_Temperature).state;
            const float hum = isnan(id(meteo_station_Humidity).state) ? 55.0f : id(meteo_station_Humidity).state;
            const float pressure = isnan(id(meteo_station_Pressure).state) ? 1013.2f : id(meteo_station_Pressure).state;
            const auto now = id(sntp_time).now();
            const long timestamp = now.timestamp;
            const float wind_avg_knots = 0.0f;
            const float wind_max_knots = 0.0f;
            const int wind_dir = 180;
            snprintf(
              buf,
              sizeof(buf),
              "${wg_test_url}?uid=${wg_test_uid}&interval=60&unixtime=%ld&wind_avg=%.2f&wind_max=%.2f&wind_direction=%d&temperature=%.2f&rh=%.2f&mslp=%.2f",
              timestamp,
              wind_avg_knots,
              wind_max_knots,
              wind_dir,
              temp,
              hum,
              pressure
            );
            return std::string(buf);
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("windguru", "Windguru send complete: HTTP %d in %u ms", response->status_code, response->duration_ms);
              - script.execute: maybe_check_ota
          on_error:
            then:
              - lambda: |-
                  ESP_LOGI("windguru", "Windguru send failed");
              - script.execute: maybe_check_ota

  - id: production_cycle
    mode: restart
    then:
      - lambda: |-
          id(network_phase_done) = false;
      - lambda: |-
          ESP_LOGI("cycle", "Cycle: measurement phase started");
      - delay: ${boot_stabilize_delay}
      - delay: ${measurement_window}
      - lambda: |-
          ESP_LOGI("cycle", "Cycle: measurement done, connecting WiFi");
      - wifi.enable:
      - wait_until:
          condition:
            wifi.connected:
          timeout: ${wifi_wait_timeout}
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: |-
                ESP_LOGI("cycle", "Cycle: WiFi connected, waiting for time sync");
            - wait_until:
                condition:
                  time.has_time:
                timeout: ${time_sync_timeout}
            - if:
                condition:
                  time.has_time:
                then:
                  # Balcony-only Home Assistant grace period:
                  # wait for API and trigger one fresh sensor read while connected
                  # so observations are visible in HA. Do not copy this behavior to
                  # the low-power Skalka production config.
                  - wait_until:
                      condition:
                        api.connected:
                      timeout: ${ha_wait_timeout}
                  - component.update: balcony_bme680
                  - component.update: balcony_scd4x
                  - delay: ${ha_publish_grace}
                  - lambda: |-
                      ESP_LOGI("cycle", "Cycle: time sync ready, sending data");
                  - script.execute: send_fake_windguru
                else:
                  - lambda: |-
                      ESP_LOGI("cycle", "Cycle: time sync timeout, upload skipped");
                  - script.execute: enter_production_sleep
          else:
            - lambda: |-
                ESP_LOGI("cycle", "Cycle: WiFi timeout, upload skipped");
            - script.execute: enter_production_sleep

sensor:
  - platform: bme680
    id: balcony_bme680
    temperature:
      name: "${device_name} Temperature"
      id: meteo_station_Temperature
    pressure:
      name: "${device_name} Pressure"
      id: meteo_station_Pressure
    humidity:
      name: "${device_name} Humidity"
      id: meteo_station_Humidity
    gas_resistance:
      name: "${device_name} Gas Resistance"
      id: meteo_station_Gas_Resistance
    address: 0x77
    update_interval: 15s

  - platform: scd4x
    id: balcony_scd4x
    co2:
      name: "${device_name} CO2"
      id: meteo_station_co2
    temperature:
      name: "${device_name} Temperature co2"
      id: meteo_station_Temperature_co2
    humidity:
      name: "${device_name} Humidity co2"
      id: meteo_station_Humidity_co2
    update_interval: 15s

binary_sensor:
  - platform: template
    name: "${friendly_name} Time Valid"
    lambda: |-
      return id(sntp_time).now().is_valid();

text_sensor:
  - platform: template
    name: "${friendly_name} OTA Last Check Saved Date"
    lambda: |-
      const int key = id(ota_last_check_key);
      if (key < 0) {
        return {"unset"};
      }

      const int year = key / 1000;
      const int day_of_year = key % 1000;
      char buffer[32];
      snprintf(buffer, sizeof(buffer), "%d / day %03d", year, day_of_year);
      return {buffer};
    update_interval: 10s

  - platform: template
    name: "${friendly_name} Firmware Version"
    id: firmware_version_text
    lambda: |-
      return {"${fw_version}"};
    update_interval: 10s
